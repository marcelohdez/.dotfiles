set -g mouse on
set escape-time 0
set -g extended-keys on
set -g allow-passthrough on
set -s set-clipboard on

# binds
bind -n M-h select-pane -L
bind -n M-j select-pane -U
bind -n M-k select-pane -D
bind -n M-l select-pane -R
bind q kill-pane
bind Q kill-session

# style
set -g pane-active-border-style "fg=green"
set -g status-style bg=terminal
set -g status-left ' #{b:pane_current_path} '
set -g status-left-length 20
set -g status-right ' %a %b %d #[bg=green fg=#000000] %I:%M #[bg=terminal] '

set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-separator ''
set -g window-status-current-style 'bg=green fg=#000000'

# fix neovim
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ',*:extkeys'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' # support undercurls
# support undercurl colors:
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
